name: Feature Request
description: Propose a new component or capability.
labels:
  - feature
body:
  - type: markdown
    attributes:
      value: |
        Give the issue a title of at most 10 words in APA title case, such as "Add a Date Picker Component".
  - type: textarea
    id: why
    attributes:
      label: Why It Is Needed
      description: A few sentences on the problem this solves or who it helps. Describe why, not how.
    validations:
      required: true
